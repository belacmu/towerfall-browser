# The private game file host (see worker.js and docs/MOBILE.md). Deploy: cd cloudflare && npx wrangler deploy
# Its KEY is a secret: npx wrangler secret put KEY (a long random string, e.g. openssl rand -hex 24).
name = "towerfall-private"
main = "worker.js"
compatibility_date = "2025-06-01"

[[r2_buckets]]
binding = "GAMEFILES"
bucket_name = "towerfall-gamefiles"
