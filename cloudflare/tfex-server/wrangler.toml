# The TF.EX-compatible matchmaking + signaling server (see worker.js and docs/MULTIPLAYER.md).
# Deploy: tools/deploy-tfex-server.sh (waits until nobody is in a match; a redeploy disconnects everyone)
# Local, the same code in workerd: npx wrangler dev --port 3000 (or: node local.mjs, no install)
# More allowed page origins: npx wrangler secret put ALLOWED_ORIGINS (comma-separated)
name = "tfex-server"
main = "worker.js"
compatibility_date = "2025-06-01"

[[durable_objects.bindings]]
name = "MATCHMAKER"
class_name = "MatchmakerObject"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "SignalRoomObject"

[[durable_objects.bindings]]
name = "REPORTS"
class_name = "ReportsObject"

[[durable_objects.bindings]]
name = "RELAYS"
class_name = "RelayRoomObject"

# TF.EX's match reports (match-reports.js): zips, dropped after 60 days by the bucket's lifecycle rule.
[[r2_buckets]]
binding = "MATCH_REPORTS"
bucket_name = "tfex-match-reports"

# SQLite-backed Durable Objects are the ones the Workers free plan includes.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["MatchmakerObject", "SignalRoomObject"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["ReportsObject"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["RelayRoomObject"]
