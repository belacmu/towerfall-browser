# Builds the site and deploys it to GitHub Pages on every push to main.
# The site contains no game files: players supply their own TowerFall folder.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache .NET SDK and wasm-tools workload
        uses: actions/cache@v4
        with:
          path: ~/.towerfall-browser/tools
          key: sdk-${{ runner.os }}-${{ hashFiles('tools/install-sdk.sh', 'web/**/*.csproj') }}

      - name: Cache FNA, native libs and FAudio
        uses: actions/cache@v4
        with:
          path: vendor
          key: vendor-${{ runner.os }}-${{ hashFiles('patches/**', 'tools/fetch-deps.sh', 'tools/build-faudio.sh', 'tools/emenv.sh', 'tools/fetch-fortrise.sh', 'tools/fetch-runtime.sh', 'tools/build-monomod.sh', 'tools/build-netplay.sh', 'netplay/**', 'tools/AnyCpu/**') }}

      - name: Cache Rust toolchain
        uses: actions/cache@v4
        with:
          path: ~/.towerfall-browser/rust
          key: rust-${{ runner.os }}-${{ hashFiles('tools/install-rust.sh', 'tools/build-netplay.sh') }}

      - name: Install SDK
        run: tools/install-sdk.sh

      - name: Install Rust
        run: tools/install-rust.sh

      - name: Fetch dependencies
        run: tools/fetch-deps.sh

      - name: Build
        run: tools/build.sh

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/bin/Release/net10.0/publish/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
