# Builds the site and deploys it to GitHub Pages: main at the root, and one other branch at
# preview/ for trying it (on a phone too) before it's merged. Same origin, so the preview shares the
# main site's browser storage: imported game files, the remembered game file host, settings, saves.
#   - Push to main, or a dispatch: rebuilds main, and the branch already in preview/ if it's still
#     around (a dispatch can name another branch, or "none").
#   - Push to any other branch: the Preview workflow (preview.yml) finishes and triggers this one,
#     which puts that branch in preview/. The last branch pushed wins.
# Deploys always run from main's copy of this workflow (workflow_run runs the default branch's), the
# branch GitHub Pages lets deploy. The site contains no game files: players supply their own.
name: Deploy

on:
  push:
    branches: [main]
  workflow_run:
    workflows: [Preview]
    types: [completed]
  workflow_dispatch:
    inputs:
      preview:
        description: Branch for preview/ (empty keeps the current one, "none" removes it)
        required: false
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      preview: ${{ steps.preview.outputs.branch }}
      preview-built: ${{ steps.preview-build.outcome }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache .NET SDK and wasm-tools workload
        uses: actions/cache@v4
        with:
          path: ~/.towerfall-browser/tools
          key: sdk-${{ runner.os }}-${{ hashFiles('tools/install-sdk.sh', 'web/**/*.csproj') }}

      - name: Cache FNA, native libs and FAudio
        uses: actions/cache@v4
        with:
          path: vendor
          key: vendor-${{ runner.os }}-${{ hashFiles('patches/**', 'tools/fetch-deps.sh', 'tools/build-faudio.sh', 'tools/emenv.sh', 'tools/fetch-fortrise.sh', 'tools/fetch-runtime.sh', 'tools/build-monomod.sh', 'tools/build-netplay.sh', 'tools/fetch-tfex.sh', 'netplay/**', 'tools/AnyCpu/**') }}

      - name: Cache Rust toolchain
        uses: actions/cache@v4
        with:
          path: ~/.towerfall-browser/rust
          key: rust-${{ runner.os }}-${{ hashFiles('tools/install-rust.sh', 'tools/build-netplay.sh') }}

      - name: Pick the preview branch
        id: preview
        env:
          EVENT: ${{ github.event_name }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT: ${{ inputs.preview }}
          SITE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          branch="" sha=""
          case "$EVENT" in
            workflow_run) branch="$RUN_BRANCH" sha="$RUN_SHA" ;;
            workflow_dispatch) branch="$INPUT" ;;
          esac
          # Otherwise keep the branch that's in preview/ now.
          [ -n "$branch" ] || branch=$(curl -sSf "$SITE/preview/preview.json" | jq -r '.branch // empty') || branch=""
          if [ "$branch" = none ] || [ "$branch" = main ]; then branch=""; fi
          if [ -n "$branch" ] && [ -z "$sha" ]; then
            # Its latest commit; a branch that's gone (merged and deleted) leaves preview/ empty.
            sha=$(git ls-remote origin "refs/heads/$branch" | cut -f1)
            [ -n "$sha" ] || { echo "Branch $branch is gone; no preview."; branch=""; }
          fi
          echo "Preview: ${branch:-(none)} ${sha}"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      # The preview is built first, in this same checkout (vendor/ and the SDK are shared and
      # re-fetched only where the branch pins something else), so vendor/ ends up as main's for
      # the cache. A failed preview doesn't stop main's deploy; the preview job below reports it.
      - name: Build the preview
        id: preview-build
        if: steps.preview.outputs.branch != ''
        continue-on-error: true
        env:
          BRANCH: ${{ steps.preview.outputs.branch }}
          SHA: ${{ steps.preview.outputs.sha }}
        run: |
          git fetch --depth 1 origin "$SHA"
          git checkout --detach FETCH_HEAD
          tools/install-sdk.sh
          tools/install-rust.sh
          tools/fetch-deps.sh
          tools/build.sh
          mkdir -p "$RUNNER_TEMP/preview"
          mv web/bin/Release/net10.0/publish/wwwroot "$RUNNER_TEMP/preview/site"
          # The page shows what it is (main.js).
          jq -n --arg branch "$BRANCH" --arg sha "$SHA" --arg built "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{branch: $branch, sha: $sha, built: $built}' > "$RUNNER_TEMP/preview/site/preview.json"

      - name: Back to main
        if: steps.preview.outputs.branch != ''
        run: git checkout --detach "$GITHUB_SHA"

      - name: Install SDK
        run: tools/install-sdk.sh

      - name: Install Rust
        run: tools/install-rust.sh

      - name: Fetch dependencies
        run: tools/fetch-deps.sh

      - name: Build
        run: tools/build.sh

      - name: Put the site together
        run: |
          mv web/bin/Release/net10.0/publish/wwwroot "$RUNNER_TEMP/site"
          if [ -d "$RUNNER_TEMP/preview/site" ]; then mv "$RUNNER_TEMP/preview/site" "$RUNNER_TEMP/site/preview"; fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Main deployed either way; a branch that was meant for preview/ but didn't build shows up red.
  preview:
    needs: [build, deploy]
    if: needs.build.outputs.preview != ''
    runs-on: ubuntu-latest
    steps:
      - env:
          BRANCH: ${{ needs.build.outputs.preview }}
          BUILT: ${{ needs.build.outputs.preview-built }}
          SITE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          if [ "$BUILT" != success ]; then
            echo "::error::The preview of $BRANCH didn't build (see the build job's \"Build the preview\" step); preview/ was left out."
            exit 1
          fi
          echo "::notice::Preview of $BRANCH: $SITE/preview/"
