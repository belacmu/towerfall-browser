# Daily upkeep:
# - refreshes mods/catalog.json from GameBanana (new mods and updates show up as "untested" until
#   tools/smoke-mods.mjs is run on a machine with the game), commits it and redeploys;
# - opens an issue when FortRise has a newer release than the one pinned in tools/fetch-fortrise.sh.
name: Upkeep

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  issues: write

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache downloaded mod zips
        uses: actions/cache@v4
        with:
          path: vendor/mod-cache
          # A new cache only when the catalog's files change (one per day filled the 10 GB limit
          # with copies, evicting the site's build caches).
          key: mod-cache-${{ hashFiles('mods/catalog.json') }}
          restore-keys: mod-cache-

      - name: Refresh the catalog
        run: python3 tools/update-catalog.py

      - name: Commit and redeploy if it changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet mods/catalog.json; then
            echo "Catalog unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh mod catalog from GameBanana" mods/catalog.json
          git push
          # Pushes made with the workflow token don't trigger other workflows; dispatches do.
          gh workflow run deploy.yml --ref main

  fortrise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for a newer FortRise
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pinned=$(grep -oP '^FORTRISE_VERSION=\K.*' tools/fetch-fortrise.sh)
          latest=$(gh api repos/FortRise/FortRise/releases/latest --jq .tag_name)
          echo "Pinned $pinned, latest $latest"
          # Only a newer version: the pin can be a prerelease ahead of the latest release (5.5.0-beta.3
          # vs 5.4.1). A release counts as newer than its own prereleases.
          python3 - "$pinned" "$latest" <<'PY' || exit 0
          import re, sys
          def key(v):
              m = re.match(r"v?(\d+)\.(\d+)\.(\d+)(?:-(.+))?$", v)
              if not m: sys.exit(1)
              pre = m.group(4)
              return tuple(map(int, m.group(1, 2, 3))), (1, "") if pre is None else (0, pre)
          sys.exit(0 if key(sys.argv[2]) > key(sys.argv[1]) else 1)
          PY
          title="FortRise $latest is out (pinned: $pinned)"
          if gh issue list --state open --search "in:title \"FortRise $latest is out\"" --json number --jq length | grep -q '^0$'; then
            gh issue create --title "$title" --body "Update FORTRISE_VERSION and FORTRISE_SHA256 in tools/fetch-fortrise.sh, rebuild, and rerun tools/smoke-mods.mjs (FortRise changes can affect mods). Release: https://github.com/FortRise/FortRise/releases/tag/$latest"
          fi
