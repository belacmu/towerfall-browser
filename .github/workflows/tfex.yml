# Keeps the hosted TF.EX (online play) on its latest release: the official server only lets the
# latest version play online. Hourly, tools/update-tfex.py checks for a new release. When it's safe
# to adopt (same ggrs-ffi as the browser build, FortRise requirement met, lobby protocol unchanged),
# the new pin goes on a branch, tfex-<version>, which is put in the site's preview/ with a pull
# request to merge it: the site runs TF.EX's code, so a person merges it. (Opening the pull request
# needs the repository setting "Allow GitHub Actions to create and approve pull requests"; without
# it, an issue links to it instead.) Otherwise an issue says what needs doing.
name: TF.EX

on:
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  issues: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for a new TF.EX
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/update-tfex.py

      - name: Put it on a branch for review, in preview/
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.check.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          [[ "$VERSION" =~ ^v?[0-9]+(\.[0-9]+)*(-[0-9A-Za-z.]+)?$ ]] || { echo "Unexpected version: $VERSION"; exit 1; }
          branch="tfex-$VERSION"
          # Done in an earlier run (this runs hourly until the pin is merged).
          if git ls-remote --exit-code origin "refs/heads/$branch" >/dev/null; then
            echo "$branch is waiting for review."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -m "TF.EX $VERSION (online play)" tools/fetch-tfex.sh
          git push origin "$branch"
          # Pushes made with the workflow token don't trigger other workflows; dispatches do.
          gh workflow run deploy.yml --ref main -f preview="$branch"
          body="TF.EX $VERSION passed tools/update-tfex.py's checks (same ggrs-ffi as the browser build, FortRise requirement met, lobby protocol unchanged). This branch pins it and is in the site's preview/ (in a few minutes): try online play there, then merge.

          The official TF.EX server only lets the latest version play online, so desktop players move to it quickly."
          title="TF.EX $VERSION (online play)"
          if ! gh pr create --base main --head "$branch" --title "$title" --body "$body"; then
            gh issue create --title "TF.EX $VERSION is ready to adopt (online play)" --body "$body

          [Open its pull request](https://github.com/$REPO/compare/main...$branch?expand=1) (this workflow couldn't: see the comment at the top of .github/workflows/tfex.yml)."
          fi

      - name: Open an issue if it can't be adopted
        if: steps.check.outputs.blocked != ''
        env:
          GH_TOKEN: ${{ github.token }}
          BLOCKED: ${{ steps.check.outputs.blocked }}
        run: |
          title="${BLOCKED%%:*} needs attention (online play)"
          if gh issue list --state open --search "in:title \"$title\"" --json number --jq length | grep -q '^0$'; then
            gh issue create --title "$title" --body "$BLOCKED

          The official TF.EX server only lets the latest version play online, so online play on the site is unavailable until this is done. See tools/update-tfex.py."
          fi
